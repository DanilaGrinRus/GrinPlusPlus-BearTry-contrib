[package]
name = "nrd-oracle"
version = "0.1.0"
edition = "2021"
description = "Line-2 NRD Rust oracle: executes real grin 5.5.2 code on tools/audit/nrd/cases/nrd_cases.json and emits actual_rust_category per case for the C++ differential runner."
license = "Apache-2.0"

# Standalone crate: never part of, and never modifies, the reference workspace.
[workspace]

[dependencies]
serde_json = "1"
chrono = "0.4.11"

# Read-only path dependencies into the reference grin 5.5.2 checkout
# (C:\Users\nurli\AppData\Local\Temp\grin55-minpeers). Override with
# `cargo build --config` or edit these paths on a different machine.
grin_core = { path = "C:/Users/nurli/AppData/Local/Temp/grin55-minpeers/core", version = "5.5.2" }
grin_chain = { path = "C:/Users/nurli/AppData/Local/Temp/grin55-minpeers/chain", version = "5.5.2" }
grin_keychain = { path = "C:/Users/nurli/AppData/Local/Temp/grin55-minpeers/keychain", version = "5.5.2" }
grin_store = { path = "C:/Users/nurli/AppData/Local/Temp/grin55-minpeers/store", version = "5.5.2" }
grin_util = { path = "C:/Users/nurli/AppData/Local/Temp/grin55-minpeers/util", version = "5.5.2" }
