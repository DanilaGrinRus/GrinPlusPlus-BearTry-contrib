<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Grin++ Bear Edition</title>
  <desc id="desc">Grin++ Bear Edition: нода Grin на C++ с десктоп-кошельком. Принимает состояние цепи от пиров через PIBD и может раздавать свой архив; на mainnet раздача включается вручную.</desc>
  <rect width="1200" height="380" rx="26" fill="#0E1012"/>
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#9AA0A8">НОДА GRIN · КОШЕЛЁК · ДЕСКТОП-UI</text>
    <text x="56" y="150" font-size="64" font-weight="700" fill="#F2EFE8">Grin++</text>
    <text x="56" y="204" font-size="44" font-weight="600" fill="#F5C518">Bear Edition</text>
    <text x="56" y="252" font-size="22" fill="#F2EFE8">Форк Grin++: десктоп-кошелёк,</text>
    <text x="56" y="282" font-size="22" fill="#F2EFE8">синхронизация через PIBD</text>
    <text x="56" y="312" font-size="22" fill="#F2EFE8">в обе стороны и выключатель Tor.</text>
    <text x="56" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9AA0A8">v2.0.0 · Windows x64 · нода C++ + UI Tauri</text>
  </g>
  <g id="pibd-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="672" y="44" width="480" height="292" rx="18" fill="#15181C" stroke="#2B3036"/>
    <text x="724" y="84" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9AA0A8">пиры</text>
    <circle cx="724" cy="120" r="13" fill="#0E1012" stroke="#9AA0A8" stroke-width="2"/><circle cx="724" cy="190" r="13" fill="#0E1012" stroke="#9AA0A8" stroke-width="2"/><circle cx="724" cy="260" r="13" fill="#0E1012" stroke="#9AA0A8" stroke-width="2"/>
    <path d="M740 151 H924" stroke="#F5C518" stroke-width="3"/>
    <path d="M916 143 L926 151 L916 159" fill="none" stroke="#F5C518" stroke-width="3"/>
    <rect x="772" y="143" width="16" height="16" rx="3" fill="#F5C518"/><rect x="796" y="143" width="16" height="16" rx="3" fill="#F5C518"/><rect x="820" y="143" width="16" height="16" rx="3" fill="#F5C518"/><rect x="844" y="143" width="16" height="16" rx="3" fill="#F5C518"/>
    <text x="772" y="130" font-size="18" fill="#F2EFE8">приём</text>
    <path d="M928 231 H744" stroke="#F5C518" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M752 223 L742 231 L752 239" fill="none" stroke="#F5C518" stroke-width="3"/>
    <rect x="772" y="223" width="16" height="16" rx="3" fill="none" stroke="#F5C518" stroke-width="2"/><rect x="796" y="223" width="16" height="16" rx="3" fill="none" stroke="#F5C518" stroke-width="2"/><rect x="820" y="223" width="16" height="16" rx="3" fill="none" stroke="#F5C518" stroke-width="2"/><rect x="844" y="223" width="16" height="16" rx="3" fill="none" stroke="#F5C518" stroke-width="2"/>
    <text x="772" y="296" font-size="18" fill="#F2EFE8">раздача · включается вручную</text>
    <path d="M738 190 H928" stroke="#2B3036" stroke-width="2"/>
    <rect x="932" y="112" width="200" height="156" rx="14" fill="#0E1012" stroke="#F5C518" stroke-width="2"/>
    <text x="1030" y="162" text-anchor="middle" font-size="26" font-weight="700" fill="#F2EFE8">GrinNode</text>
    <text x="1030" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9AA0A8">PIBD 0x10 / 0x40</text>
    <text x="1030" y="230" text-anchor="middle" font-size="18" fill="#F2EFE8">кошелёк · Tor</text>
  </g>
</svg>
