name: linux-ci

on:
  workflow_dispatch:
  push:
    branches:
      - linux-ci-20261108

jobs:
  linux:
    name: ubuntu-20.04-gcc10-vcpkg2020
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Toolchain and deps
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git zip unzip tar build-essential g++-10 gcc-10 \
            cmake ninja-build pkg-config autoconf automake libtool python3 \
            libssl-dev zlib1g-dev uuid-dev libgflags-dev
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100
          gcc --version | head -1
          g++ --version | head -1
          cmake --version | head -1
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: vcpkg bootstrap and packages
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout 6185aa76504a5025f36754324abf307cc776f3da
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg/vcpkg install --triplet x64-linux \
            --overlay-ports="$GITHUB_WORKSPACE/vcpkg/custom_ports" \
            @"$GITHUB_WORKSPACE/vcpkg/packages.txt"

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRINPP_TESTS=ON \
            -DGRINPP_TOOLS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --parallel 2

      - name: Tests
        shell: bash
        run: |
          set -euxo pipefail
          ./bin/Release/Tests --reporter compact
