name: linux-ci

on:
  workflow_dispatch:
  push:
    branches:
      - linux-ci-20261108

jobs:
  linux:
    name: ubuntu-20.04-gcc10-vcpkg2020
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Toolchain and deps
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git zip unzip tar build-essential g++-10 gcc-10 \
            cmake ninja-build pkg-config autoconf automake libtool python3 \
            libssl-dev zlib1g-dev uuid-dev libgflags-dev
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100
          gcc --version | head -1
          g++ --version | head -1
          cmake --version | head -1
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare overlay ports
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .ci-overlay
          cp -r vcpkg/custom_ports/civetweb vcpkg/custom_ports/roaring vcpkg/custom_ports/rocksdb vcpkg/custom_ports/secp256k1-zkp .ci-overlay/
          cp -r vcpkg/custom_ports/libsodium .ci-overlay/
          sed -i 's/727fe50a5fb1df86ec5d807770f408a52609cbeb8510b4f4183b2a35a537905719bdb6348afcb103ff00ce946a8094ac9559b6e3e5b2ccc2a2d0c08f75577eeb/269bda48307db8b7b4bd734704bc49add71f947704109416f9e9d2304bc60a39fa33ae201ccac54721bdce7d521067fc3d75022044557ab6cb37890b03505411/' .ci-overlay/libsodium/portfile.cmake

      - name: vcpkg bootstrap and packages
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/microsoft/vcpkg.git .ci-vcpkg
          git -C .ci-vcpkg checkout 6185aa76504a5025f36754324abf307cc776f3da
          ./.ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./.ci-vcpkg/vcpkg install --triplet x64-linux \
            --overlay-ports="$GITHUB_WORKSPACE/.ci-overlay" \
            @"$GITHUB_WORKSPACE/vcpkg/packages.txt"

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRINPP_TESTS=ON \
            -DGRINPP_TOOLS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.ci-vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --parallel 2

      - name: Tests
        shell: bash
        run: |
          set -euxo pipefail
          ./bin/Release/Tests --reporter compact
