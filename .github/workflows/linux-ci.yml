name: linux-ci

on:
  workflow_dispatch:
  push:
    branches:
      - linux-ci-20261108

jobs:
  linux:
    name: ubuntu-20.04-gcc10-vcpkg2020
    runs-on: ubuntu-24.04
    container: ubuntu:20.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Toolchain and deps
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git zip unzip tar build-essential g++-10 gcc-10 \
            cmake ninja-build pkg-config autoconf automake libtool python3 \
            libssl-dev zlib1g-dev uuid-dev libgflags-dev
          update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100
          update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100
          gcc --version | head -1
          g++ --version | head -1
          cmake --version | head -1
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare overlay ports
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .ci-overlay
          cp -r vcpkg/custom_ports/civetweb vcpkg/custom_ports/roaring vcpkg/custom_ports/rocksdb vcpkg/custom_ports/secp256k1-zkp .ci-overlay/
          cp -r vcpkg/custom_ports/libsodium .ci-overlay/
          sed -i 's/727fe50a5fb1df86ec5d807770f408a52609cbeb8510b4f4183b2a35a537905719bdb6348afcb103ff00ce946a8094ac9559b6e3e5b2ccc2a2d0c08f75577eeb/269bda48307db8b7b4bd734704bc49add71f947704109416f9e9d2304bc60a39fa33ae201ccac54721bdce7d521067fc3d75022044557ab6cb37890b03505411/' .ci-overlay/libsodium/portfile.cmake

      - name: vcpkg bootstrap and packages
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/microsoft/vcpkg.git .ci-vcpkg
          git -C .ci-vcpkg checkout 6185aa76504a5025f36754324abf307cc776f3da
          ./.ci-vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./.ci-vcpkg/vcpkg install --triplet x64-linux \
            --overlay-ports="$GITHUB_WORKSPACE/.ci-overlay" \
            @"$GITHUB_WORKSPACE/vcpkg/packages.txt"

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRINPP_TESTS=ON \
            -DGRINPP_TOOLS=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.ci-vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --parallel 2

      - name: Record build provenance and binary SHA-256
        if: always()
        shell: bash
        run: |
          set -uxo pipefail
          mkdir -p ci-evidence
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "commit_subject=$(git log -1 --pretty=%s)"
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_image=$(grep PRETTY_NAME /etc/os-release | head -1)"
            echo "gcc=$(gcc --version | head -1)"
            echo "gxx=$(g++ --version | head -1)"
            echo "cmake=$(cmake --version | head -1)"
            echo "vcpkg=$(git -C .ci-vcpkg rev-parse HEAD 2>/dev/null || echo missing)"
            echo "--- binaries ---"
            ls -l bin/Release/ 2>&1 || true
            echo "--- sha256 ---"
            sha256sum bin/Release/GrinNode bin/Release/Tests 2>&1 || true
            echo "--- elf headers ---"
            readelf -h bin/Release/GrinNode 2>&1 | head -20 || true
          } | tee ci-evidence/build-info.txt

      - name: Node smoke on clean container
        if: always()
        shell: bash
        timeout-minutes: 10
        run: |
          set -uxo pipefail
          mkdir -p ci-evidence/smoke
          if [ ! -x bin/Release/GrinNode ]; then
            echo "SMOKE_RESULT=FAIL reason=GrinNode binary missing" | tee ci-evidence/smoke/smoke.txt
            exit 1
          fi

          cat > ci-evidence/smoke/config.json <<EOF
          {
            "DATA_PATH": "$GITHUB_WORKSPACE/ci-evidence/smoke/data",
            "LOGGER": { "LOG_LEVEL": "INFO" },
            "P2P": { "MAX_PEERS": 2, "MIN_PEERS": 0, "P2P_PEER_PORT": 3414, "P2P_PORT": 20514 },
            "SERVER": { "REST_API_PORT": 20513 }
          }
          EOF

          set +e
          ./bin/Release/GrinNode --headless --no-wallet \
            --config-path "$GITHUB_WORKSPACE/ci-evidence/smoke/config.json" \
            > ci-evidence/smoke/node.out 2>&1 &
          NODE_PID=$!

          HEALTH=""
          for _ in $(seq 1 120); do
            if ! kill -0 "$NODE_PID" 2>/dev/null; then break; fi
            HEALTH=$(curl -fsS --max-time 2 http://127.0.0.1:20513/v1/status 2>/dev/null)
            if [ -n "$HEALTH" ]; then break; fi
            sleep 1
          done

          RESULT=FAIL
          if [ -n "$HEALTH" ]; then RESULT=PASS; fi
          printf 'SMOKE_RESULT=%s\nHEALTH=%s\n' "$RESULT" "$HEALTH" | tee ci-evidence/smoke/smoke.txt

          kill -INT "$NODE_PID" 2>/dev/null
          for _ in $(seq 1 20); do kill -0 "$NODE_PID" 2>/dev/null || break; sleep 1; done
          kill -9 "$NODE_PID" 2>/dev/null
          wait "$NODE_PID" 2>/dev/null

          find ci-evidence/smoke/data -name '*.log' -exec cp -f {} ci-evidence/smoke/ \; 2>/dev/null || true
          cp -f tor/*.log ci-evidence/smoke/ 2>/dev/null || true

          set -e
          [ "$RESULT" = "PASS" ]

      - name: Tests (hard timeout, full log preserved)
        if: always()
        id: tests
        shell: bash
        timeout-minutes: 60
        run: |
          set -uxo pipefail
          mkdir -p ci-evidence
          set +e
          timeout --signal=INT --kill-after=120s 3000 \
            ./bin/Release/Tests --reporter compact -s 2>&1 | tee ci-evidence/tests.log
          code=${PIPESTATUS[0]}
          set -e
          echo "TESTS_EXIT=${code}" | tee -a ci-evidence/tests.log
          echo "tests_exit=${code}" >> "$GITHUB_OUTPUT"
          {
            echo "### Tests"
            echo '```'
            tail -n 15 ci-evidence/tests.log || true
            echo '```'
            echo "TESTS_EXIT=${code}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error::Tests exited with ${code} (124 = hard timeout, 125 = timeout command failure)"
            exit "$code"
          fi

      - name: Upload evidence and binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ci-${{ github.run_id }}
          path: |
            ci-evidence/**
            bin/Release/GrinNode
            bin/Release/Tests
          if-no-files-found: warn
          retention-days: 14
